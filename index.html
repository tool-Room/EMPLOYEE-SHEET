<!DOCTYPE html>
<html>

<head>

  <title>
    Tool Room Activity Sheet
  </title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>

  <!-- LOADING -->

  <div id="loading-screen">

    <img src="logo.png"
         class="logo">

    <h1>
      TOOL ROOM ACTIVITIES
    </h1>

    <div class="loader"></div>

  </div>

  <!-- MAIN -->

  <div id="main-content">

    <!-- HEADER -->

    <header>

      <div class="header-left">

        <img src="logo.png"
             class="header-logo">

        <div>

          <h1>
            TOOL ROOM ACTIVITY SHEET
          </h1>

          <p>
            Leader :
            Nagaraja Kamble
          </p>

          <p>
            nkamble@forbesmarshall.com
          </p>

        </div>

      </div>

      <button id="loginBtn">
        LOGIN
      </button>

    </header>

    <!-- SEARCH -->

    <div class="search-container">

      <input
        type="text"
        id="searchInput"
        placeholder="Search Project">

      <button onclick="searchData()">
        Search
      </button>

    </div>

    <!-- FILTER -->

    <div class="filter-container">

      <select id="statusFilter">

        <option value="">
          All Status
        </option>

        <option value="Completed">
          Completed
        </option>

        <option value="In Progress">
          In Progress
        </option>

      </select>

    </div>

    <!-- DEPARTMENTS -->

    <div class="department-container">

      <div class="card"
           onclick="showDepartment('Designing')">

        DESIGNING

      </div>

      <div class="card"
           onclick="showDepartment('Automation')">

        AUTOMATION

      </div>

      <div class="card"
           onclick="showDepartment('Manufacturing')">

        MANUFACTURING

      </div>

    </div>

    <!-- RESULTS -->

    <div id="results"></div>

    <!-- ADMIN PANEL -->

    <div id="adminPanel"
         style="display:none;">

      <h2>
        ADD PROJECT
      </h2>

      <input
        id="projectName"
        placeholder="Project Name">

      <input
        id="projectLeader"
        placeholder="Project Leader">

      <input
        id="startDate"
        type="date">

      <input
        id="expectedEndDate"
        type="date">

      <button onclick="addProject()">
        Add Project
      </button>

    </div>

    <!-- FOOTER -->

    <footer>

      © 2026 Forbes Marshall

      <br>

      All Rights Reserved

      <br>

      Designed By Tool Room

    </footer>

  </div>

  <script src="script.js"></script>

</body>

</html>
