<!DOCTYPE html>
<html>

<head>

  <title>Tool Room Activity Sheet</title>

  <link rel="stylesheet"
        href="style.css?v=1">

</head>

<body>

<!-- LOADING -->

<div id="loading-screen">

  <img src="logo.png"
       class="logo">

  <h1 class="loading-title">
    TOOL ROOM ACTIVITIES
  </h1>

  <div class="loader"></div>

</div>

<!-- MAIN -->

<div id="main-content">

  <!-- HEADER -->

  <header>

    <div class="header-left">

      <img src="logo.png"
           class="header-logo">

      <h1>
        TOOL ROOM ACTIVITY SHEET
      </h1>

    </div>

    <div class="header-right">

      <p>
        Leader: Nagaraja Kamble
      </p>

      <p>
        nkamble@forbesmarshall.com
      </p>

      <button id="loginBtn">
        LOGIN
      </button>

    </div>

  </header>

  <!-- DASHBOARD -->

  <div class="dashboard">

    <div class="dash-card">

      <h2 id="toolCount">
        0
      </h2>

      <p>
        Total Projects
      </p>

    </div>

    <div class="dash-card">

      <h2 id="ongoingCount">
        0
      </h2>

      <p>
        Ongoing
      </p>

    </div>

    <div class="dash-card">

      <h2 id="completedCount">
        0
      </h2>

      <p>
        Completed
      </p>

    </div>

  </div>

  <!-- SEARCH -->

  <div class="search-box">

    <input type="text"
           id="searchInput"
           placeholder="Search Project">

    <button onclick="searchProject()">
      Search
    </button>

  </div>

  <!-- DEPARTMENTS -->

  <div class="departments">

    <div class="dept-card"
         onclick="showProjects()">

      DESIGNING

    </div>

    <div class="dept-card"
         onclick="showProjects()">

      AUTOMATION

    </div>

    <div class="dept-card"
         onclick="showProjects()">

      MANUFACTURING

    </div>

  </div>

  <!-- RESULTS -->

  <div id="results"></div>

  <!-- FOOTER -->

  <footer>

    <div>
      © 2026 Forbes Marshall — All Rights Reserved
    </div>

    <div class="footer-small">
      Designed By Tool Room
    </div>

  </footer>

</div>

<script src="script.js?v=1"></script>

</body>

</html>
